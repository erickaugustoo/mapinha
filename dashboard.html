  .tabs button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .row{ display:grid; grid-template-columns: 132px 1fr auto; align-items:center; gap:8px;
    padding:3px 4px; border-radius:6px; cursor:default; }
  .row:hover{ background:rgba(127,127,127,.10); }

  .row .nm small{ color:var(--muted); }
  .bar{ height:9px; border-radius:4px; position:relative; }
  .bar .fill{ position:absolute; top:0; height:9px; border-radius:4px; }
  .val{ font-variant-numeric:tabular-nums; text-align:right; font-weight:600; white-space:nowrap; color:var(--text); }

const fmt = v => v==null?'—':'R$ '+Math.round(v).toLocaleString('pt-BR');
const sig = v => (v>=0?'+':'')+v.toFixed(1)+'%';
document.getElementById('ref').textContent =
  `ref ${D.meta.referencia||''} · ${D.meta.bairros||0} bairros · mediana geral ${fmt(D.meta.m2_mediana_geral)}/m² · atualizado ${D.quando}`;

// ----- mapa (locator) -----
const map = L.map('map', {preferCanvas:true, zoomControl:true}).setView([-23.62,-46.65], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:18, attribution:'© OpenStreetMap'}).addTo(map);
let pino = null;
function acende(b, cor){
  document.getElementById('mapcap').textContent =
    b.lat==null ? `${b.nome}: sem coordenada` :
    `${b.nome} · ${fmt(b.m2)}/m² · ${b.n} anúncios`;
  if (b.lat==null) return;
  if (pino) map.removeLayer(pino);
  pino = L.circleMarker([b.lat,b.lon], {radius:11, color:cor, weight:3, fillColor:cor, fillOpacity:.35}).addTo(map);
  map.panTo([b.lat,b.lon], {animate:true});
}

// ----- linhas de ranking -----
function linhaValoriz(b, lbl, maxAbs){
  const v = b.var[lbl], up = v>=0, cor = up?'var(--up)':'var(--dn)';
  const w = Math.max(4, Math.abs(v)/maxAbs*100);   // metade da barra p/ cada lado
  const div = document.createElement('div');
  div.className='row';
  div.innerHTML = `<div class="nm">${b.nome}<br><small>${fmt(b.m2)}/m²</small></div>
    <div class="bar" style="background:transparent">
      <div style="position:absolute;left:50%;top:-2px;height:13px;border-left:1px solid var(--border)"></div>
      <div class="fill" style="${up?'left:50%':'right:50%'};width:${w/2}%;background:${cor}"></div></div>
    <div class="val ${up?'up':'dn'}">${sig(v)}</div>`;
  div.onmouseenter = ()=>acende(b, cor);
  return div;
}
function linhaPreco(b, max, cor){
  const w = Math.max(4, b.m2/max*100);
  const div = document.createElement('div');
  div.className='row';
  div.innerHTML = `<div class="nm">${b.nome}<br><small>${b.n} anúncios</small></div>
    <div class="bar" style="background:rgba(127,127,127,.12)"><div class="fill" style="left:0;width:${w}%;background:${cor}"></div></div>
    <div class="val">${fmt(b.m2)}</div>`;
  div.onmouseenter = ()=>acende(b, cor);
  return div;
}
function encher(el, arr, fn){ el.innerHTML=''; arr.forEach(b=>el.appendChild(fn(b))); }

// ----- tiles -----
function tiles(lbl){
  const w = D.valoriz[lbl];
  const t = [
    ['bairros mapeados', D.meta.bairros||0, ''],
    ['mediana R$/m²', fmt(D.meta.m2_mediana_geral), ''],
  ];
  if (w) { t.push(['valorizaram ('+lbl+')', w.n_sobe, 'de '+w.n_total]);
           t.push(['caíram ('+lbl+')', w.n_cai, 'de '+w.n_total]); }
  document.getElementById('tiles').innerHTML = t.map(([l,v,s])=>
    `<div class="tile"><div class="v">${v}</div><div class="l">${l}${s?' · '+s:''}</div></div>`).join('');
}

// ----- valorização com abas -----
let janela = Object.keys(D.valoriz)[0] || null;
function renderValoriz(){
  if (!janela){ document.getElementById('cap-val').textContent='sem histórico suficiente ainda'; return; }
  const w = D.valoriz[janela];
  const maxAbs = Math.max(2, ...w.sobe.concat(w.cai).map(b=>Math.abs(b.var[janela])));
  document.getElementById('cap-val').textContent =
    `variação do R$/m² mediano vs ${w.dias} dia(s) atrás (base ${w.base.split('-').reverse().join('/')})`;
  encher(document.getElementById('sobe'), w.sobe, b=>linhaValoriz(b, janela, maxAbs));
  encher(document.getElementById('cai'),  w.cai,  b=>linhaValoriz(b, janela, maxAbs));
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on', x.dataset.j===janela));
  tiles(janela);
}
document.getElementById('tabs').innerHTML = Object.keys(D.valoriz).map(j=>{
  const rot = {'24h':'24 horas','7d':'7 dias','30d':'30 dias'}[j]||j;
  return `<button data-j="${j}">${rot}</button>`;}).join('') || '<span class="cap">sem janelas</span>';
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{janela=b.dataset.j; renderValoriz();});

// ----- preço -----
const maxCaro = Math.max(...D.caros.map(b=>b.m2));
encher(document.getElementById('caros'), D.caros, b=>linhaPreco(b, maxCaro, 'var(--seq)'));
encher(document.getElementById('baratos'), D.baratos, b=>linhaPreco(b, maxCaro, 'var(--seq)'));

// ----- tema -----
function troca(){
  const cur = document.documentElement.getAttribute('data-theme');
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
}
renderValoriz(); tiles(janela);
setTimeout(()=>map.invalidateSize(), 200);
</script>
