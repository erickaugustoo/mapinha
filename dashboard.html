<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FipeErick — dashboard por bairro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f4f7f5; --surface:#fff; --border:#e4eae7; --text:#12201b; --muted:#65766e;
    --accent:#0a5c43; --accent-soft:#e7f5ec; --chip:#f1f5f3;
  }
  :root[data-theme=dark]{ --bg:#0f1216; --surface:#171b21; --border:#2a2f37; --text:#e6e9ee;
    --muted:#9aa4b2; --accent:#34d399; --accent-soft:#12241d; --chip:#1e242c; }
  :root[data-theme=light]{ --bg:#f4f7f5; --surface:#fff; --border:#e4eae7; --text:#12201b;
    --muted:#65766e; --accent:#0a5c43; --accent-soft:#e7f5ec; --chip:#f1f5f3; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  header{ padding:14px 20px; border-bottom:1px solid var(--border); display:flex;
    align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1{ font-size:17px; margin:0; letter-spacing:-.01em; }
  header .sub{ color:var(--muted); font-size:12px; }
  header .right{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  header a, .toggle{ color:var(--accent); text-decoration:none; font-size:13px; cursor:pointer;
    border:1px solid var(--border); border-radius:9px; padding:4px 10px; background:transparent; }
  .wrap{ display:grid; grid-template-columns: minmax(0,1fr) minmax(0,1.05fr); gap:16px; padding:16px 20px 26px; align-items:start; }
  @media (max-width:940px){ .wrap{ grid-template-columns:1fr; } #mapwrap{ order:-1; } }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px;
    box-shadow:0 10px 30px rgba(16,40,30,.06); overflow:hidden; }
  .card__ctrls{ padding:14px 16px 12px; border-bottom:1px solid var(--border); display:flex;
    flex-direction:column; gap:11px; }
  .ctrl-lab{ font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px; }
  .segbar{ display:flex; flex-wrap:wrap; gap:6px; }
  .seg{ border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer;
    border-radius:999px; padding:6px 13px; font-size:13px; font-weight:500; display:inline-flex;
    align-items:center; gap:7px; transition:all .13s; }
  .seg:hover{ border-color:var(--accent); color:var(--text); }
  .seg.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .seg .sw{ width:9px; height:9px; border-radius:3px; }
  .row2{ display:flex; gap:22px; flex-wrap:wrap; }
  .row2 > div{ min-width:0; }
  #winWrap.hide{ display:none; }
  .listhead{ display:flex; align-items:baseline; justify-content:space-between; padding:10px 16px 6px; }
  .listhead .t{ font-size:13px; font-weight:600; }
  .listhead .c{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .card__search{ display:flex; align-items:center; gap:8px; margin:10px 16px 2px; padding:0 12px;
    height:38px; border:1px solid var(--border); border-radius:11px; background:var(--bg);
    transition:border-color .13s, box-shadow .13s; }
  .card__search:focus-within{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .card__search svg{ color:var(--muted); flex:none; }
  .card__search input{ border:0; outline:0; background:none; font:inherit; font-size:13.5px;
    width:100%; color:var(--text); }
  .card__search input::placeholder{ color:var(--muted); }
  .list{ max-height:520px; overflow-y:auto; padding:2px 8px 10px; }
  .r{ display:grid; grid-template-columns: 24px 210px minmax(60px,1fr) auto; align-items:center; gap:10px;
    padding:5px 8px; border-radius:8px; cursor:default; }
  .r:hover{ background:var(--chip); }
  .r.hot{ background:var(--accent-soft); }
  .r .rk{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; color:var(--muted);
    text-align:right; }
  .r .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .r .nm small{ color:var(--muted); font-weight:400; font-size:11px; }
  .bar{ height:9px; border-radius:5px; position:relative; background:transparent; }
  .bar .f{ position:absolute; top:0; height:9px; border-radius:5px; }
  .bar .zero{ position:absolute; left:50%; top:-2px; height:13px; border-left:1px solid var(--border); }
  .r .v{ font-variant-numeric:tabular-nums; font-weight:600; text-align:right; white-space:nowrap;
    font-size:13px; min-width:74px; }
  #mapwrap{ position:sticky; top:16px; }
  #map{ height:600px; border-radius:16px; border:1px solid var(--border); }
  .maplegend{ display:flex; align-items:center; gap:10px; margin-top:10px; font-size:12px; color:var(--muted); }
  .maplegend .ramp{ flex:1; height:9px; border-radius:5px; }
  .tiles{ display:flex; gap:8px; padding:0 20px 4px; flex-wrap:wrap; }
  .tile{ font-size:12px; color:var(--muted); }
  .tile b{ color:var(--text); font-weight:600; }
  ::-webkit-scrollbar{ width:9px; } ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:9px; }
</style>
</head>

/* ---- rampas de cor (claro→escuro) e diverging ---- */
const RAMPS = {
  violet:['#ede9fe','#6d28d9'], green:['#d1fae5','#047857'],
  blue:['#dbeafe','#1d4ed8'],  slate:['#cbd5e1','#334155'],
  amber:['#fde9c8','#b45309'], rose:['#ffd9de','#be123c'],
};
const hex = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix = (a,b,t)=>{const A=hex(a),Bc=hex(b);return `rgb(${A.map((x,i)=>Math.round(x+(Bc[i]-x)*t)).join(',')})`;};
const seqColor = (ramp,t)=> mix(RAMPS[ramp][0],RAMPS[ramp][1], Math.max(0,Math.min(1,t)));
const DIV_UP='#f59e0b', DIV_DN='#3b82f6', DIV_MID='#e5e7eb';
const divColor = (v,maxAbs)=>{ const t=Math.max(0,Math.min(1,Math.abs(v)/maxAbs));
  return mix(DIV_MID, v>=0?DIV_UP:DIV_DN, t); };

};
const SW = { val:DIV_UP, preco:RAMPS.violet[1], seg:RAMPS.green[1], alag:RAMPS.blue[1],
             arv:RAMPS.amber[1], dec:RAMPS.rose[1], anun:RAMPS.slate[1] };

let insight='val', ordem='desc', win=Object.keys(D.janelas)[0]||null;

/* ---- controles ---- */
document.getElementById('insights').innerHTML = Object.entries(INS).map(([k,o])=>
  `<button class="seg" data-k="${k}"><span class="sw" style="background:${SW[k]}"></span>${o.label}</button>`).join('');
document.getElementById('janelas').innerHTML = Object.keys(D.janelas).map(w=>{
  const rot={'24h':'24 horas','7d':'7 dias','30d':'30 dias'}[w]||w;
  return `<button class="seg" data-w="${w}">${rot}</button>`; }).join('');
function renderOrdem(){
  const o=INS[insight].ord;
  document.getElementById('ordem').innerHTML =
    `<button class="seg" data-o="desc">↓ ${o.desc}</button><button class="seg" data-o="asc">↑ ${o.asc}</button>`;
  document.querySelectorAll('#ordem .seg').forEach(b=>{ b.classList.toggle('on', b.dataset.o===ordem);
    b.onclick=()=>{ ordem=b.dataset.o;
      document.querySelectorAll('#ordem .seg').forEach(x=>x.classList.toggle('on', x.dataset.o===ordem));
      render(); }; });
}
document.querySelectorAll('#insights .seg').forEach(b=> b.onclick=()=>{
  insight=b.dataset.k; ordem=INS[insight].defd;
  document.getElementById('winWrap').classList.toggle('hide', !INS[insight].win);
  renderOrdem(); render(); });
document.querySelectorAll('#janelas .seg').forEach(b=> b.onclick=()=>{ win=b.dataset.w; render(); });

/* ---- mapa ---- */
const norm = s => (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const map = L.map('map',{preferCanvas:true}).setView([-23.62,-46.63],10.4);
const CARTO = t => `https://{s}.basemaps.cartocdn.com/${t}/{z}/{x}/{y}{r}.png`;
const ehDark = () => document.documentElement.getAttribute('data-theme')==='dark';
const strokeCor = () => ehDark() ? 'rgba(255,255,255,.9)' : 'rgba(15,32,25,.6)';
const tiles = L.tileLayer(CARTO(ehDark()?'dark_all':'light_all'),
  {maxZoom:18, subdomains:'abcd', attribution:'© OSM · CARTO'}).addTo(map);
const dots = {};
B.forEach((b,i)=>{ if(b.lat==null) return;
  dots[i]=L.circleMarker([b.lat,b.lon],{radius:6,weight:1.4,color:strokeCor(),fillOpacity:.95,fillColor:'#ccc'})
    .addTo(map).on('mouseover',()=>hot(i,true)).on('mouseout',()=>hot(i,false)); });

function valOf(b){ return insight==='val' ? (b.var[win]) : INS[insight].get(b); }
function hot(i,on){
  const row=document.getElementById('r'+i); if(row) row.classList.toggle('hot',on);
  const d=dots[i]; if(d){ d.setStyle({radius:on?10:6,weight:on?2.4:1.4}); if(on) d.bringToFront(); }
  if(on){ const b=B[i]; const v=valOf(b);
    document.getElementById('mapcap').textContent =
      `${b.nome} · ${v==null?'—':INS[insight].fmt(v)} · ${b.n} anúncios à venda`; }
}

/* ---- render principal ---- */
let q = '';
function render(){
  const o=INS[insight];
  const all=B.map((b,i)=>({b,i,v:valOf(b)})).filter(x=>x.v!=null);
  all.sort((a,z)=> ordem==='desc' ? z.v-a.v : a.v-z.v);
  all.forEach((x,idx)=> x.rank=idx+1);
  const vals=all.map(x=>x.v);
  const maxAbs=Math.max(0.1,...vals.map(Math.abs));
  const lo=Math.min(...vals), hi=Math.max(...vals), span=(hi-lo)||1;
  const colorOf = v => o.kind==='div' ? divColor(v,maxAbs) : seqColor(o.ramp,(v-lo)/span);
  const match = b => !q || norm(b.nome).includes(q);
  const rows = q ? all.filter(x=>match(x.b)) : all;

  // lista (rank é a posição no ranking COMPLETO, mesmo filtrando na busca)
  const el=document.getElementById('list');
  if(!rows.length){ el.innerHTML=`<div style="padding:20px 12px;color:var(--muted);font-size:13px">Nenhum bairro encontrado para “${q}”.</div>`; }
  else {
    el.innerHTML='';
    const frag=document.createDocumentFragment();
    rows.forEach(x=>{
      const {b,i,v,rank}=x; const cor=colorOf(v);
      const div=document.createElement('div'); div.className='r'; div.id='r'+i;
      let bar;
      if(o.kind==='div'){ const up=v>=0, w=Math.abs(v)/maxAbs*50;
        bar=`<div class="bar"><div class="zero"></div><div class="f" style="${up?'left:50%':'right:50%'};width:${w}%;background:${cor}"></div></div>`; }
      else { const w=Math.max(3,(v-lo)/span*100);
        bar=`<div class="bar" style="background:var(--chip)"><div class="f" style="left:0;width:${w}%;background:${cor}"></div></div>`; }
      const sub = insight==='val'
        ? `Era ${fmtR(b.vbase[win])} → ${fmtR(b.m2)}/m²`
        : `${b.n} anúncios · ${fmtR(b.m2)}/m²`;
      div.innerHTML=`<div class="rk">${rank}</div>
        <div class="nm">${b.nome}<br><small>${sub}</small></div>
        ${bar}<div class="v">${o.fmt(v)}</div>`;
      div.onmouseenter=()=>hot(i,true); div.onmouseleave=()=>hot(i,false);
      div.onclick=()=>{ if(b.lat!=null) map.panTo([b.lat,b.lon],{animate:true}); };
      frag.appendChild(div);
    });
    el.appendChild(frag);
  }

  // pontos do mapa (contorno segue o tema; busca destaca os que casam)
  const sc=strokeCor();
  B.forEach((b,i)=>{ const d=dots[i]; if(!d) return; const v=valOf(b); const m=match(b);
    if(v==null){ d.setStyle({color:sc,fillColor:'#cbd5e1',fillOpacity:(q&&!m)?.08:.3,weight:1,radius:4}); }
    else { d.setStyle({color:sc,fillColor:colorOf(v),fillOpacity:m?.95:.12,weight:m?1.4:.5,radius:m?6:4}); } });

  // cabeçalho + legenda
  const cur=INS[insight].ord[ordem];
  document.getElementById('listTitle').textContent = insight==='val'
    ? `${cur} · ${ {'24h':'24 horas','7d':'7 dias','30d':'30 dias'}[win]||win }` : cur;
  document.getElementById('listCount').textContent = q ? `${rows.length} de ${all.length}` : `${all.length} bairros`;
  const lgLo=document.getElementById('lgLo'), lgHi=document.getElementById('lgHi');
  if(o.kind==='div'){
    document.getElementById('lgRamp').style.background=`linear-gradient(90deg,${DIV_DN},${DIV_MID},${DIV_UP})`;
    lgLo.textContent='caiu'; lgHi.textContent='valorizou';
  } else {
    document.getElementById('lgRamp').style.background=`linear-gradient(90deg,${RAMPS[o.ramp][0]},${RAMPS[o.ramp][1]})`;
    lgLo.textContent=o.fmt(lo); lgHi.textContent=o.fmt(hi);
  }
}
document.getElementById('q').addEventListener('input', e=>{ q=norm(e.target.value); render(); });

/* estado inicial dos controles */
function marcaAtivos(){
  document.querySelectorAll('#insights .seg').forEach(b=>b.classList.toggle('on',b.dataset.k===insight));
  document.querySelectorAll('#janelas .seg').forEach(b=>b.classList.toggle('on',b.dataset.w===win));
}
document.querySelectorAll('#insights .seg').forEach(b=> b.addEventListener('click',marcaAtivos));
document.querySelectorAll('#janelas .seg').forEach(b=> b.addEventListener('click',marcaAtivos));
renderOrdem(); marcaAtivos(); render();
setTimeout(()=>map.invalidateSize(),200);

function troca(){
  const dark=ehDark();
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  tiles.setUrl(CARTO(dark?'light_all':'dark_all'));
  render();
}
</script>
</body>
</html>
